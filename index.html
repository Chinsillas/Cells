<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cells</title>
        <style>
            body{font-family:Helvetica, sans-serif; padding: 20px; max-width: 500px; margin: auto;}
            .card{background: #f4f4f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;}
            input, select, button { 
                display: block;
                width: 100%; 
                box-sizing: border-box; 
                -webkit-appearance: none;
                appearance: none;
                height: 44px;
                padding: 0 10px; 
                margin: 5px 0; 
                border: 1px solid #ccc; 
                border-radius: 8px; 
                font-size: 14px;
                background-color: #fff;
            }
            table{width: 100%; border-collapse: collapse; margin-top: 10px;}
            th, td{border: 1px solid #ddd; padding: 8px; text-align: left;}

            input[type="date"], input[type="month"] {
                color: #000000;
                text-align: center;
                display: flex;
                align-items: center;
                justify-content: center;
                line-height: 44px;
            }

            input[type="date"]::-webkit-date-and-time-value,
            input[type="month"]::-webkit-date-and-time-value {
                text-align: center;
                color: #000000;
                margin: auto;
            }

            button { 
                background-color: #28a745; 
                color: white; 
                border: none; 
                font-weight: bold; 
                cursor: pointer; 
            }

            .btn-delete {
                background-color: #dc3545 !important; /* Behält den roten Hintergrund */
                color: white !important;
                width: auto !important;
                height: auto !important;
                padding: 6px 8px !important;
            }

        </style>
    </head>
    <body>
        <h2>Cells – My Finance Planer</h2>

        <div class="filter-selection">
            <label for="month-filter"><strong>Select Month:</strong></label>
            <input type="month" id="month-filter" onchange="updateUI()">
        </div>

        <div class="card">
            <h3>This Month's Sum: <span id="total">0</span>€</h3>
            <input type="text" id="desc" placeholder="Description">
            <input type="number" id="amount" placeholder="Amount">
            <input type="date" id="date">
            <button onclick="addTransaction()">Add Transaction</button>
        </div> 

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="transaction-list"></tbody>
        </table>

        <script>
            let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];
           
            const today = new Date();
            document.getElementById('date').value = today.toISOString().split('T')[0];

            const currentMonthYear = today.toISOString().slice(0, 7);
            document.getElementById('month-filter').value = currentMonthYear;

            updateUI();

            function addTransaction(){
                const descInput = document.getElementById('desc');
                const amountInput = document.getElementById('amount');
                const dateInput = document.getElementById('date')

                const desc = descInput.value;
                const amount = parseFloat(amountInput.value);
                const date = dateInput.value;

                if (!desc || isNaN(amount) || !date){
                    alert("Please enter a valid Description and Amount");
                    return;
                }

                const newTransaction ={
                    id: Date.now(),
                    desc: desc,
                    amount: amount,
                    date: date
                };
                
                transactions.push(newTransaction);
                saveToLocalStorage();

                document.getElementById('month-filter').value = date.slice(0, 7);

                updateUI()

                descInput.value = '';
                amountInput.value = '';
                document.getElementById('date').value = today.toISOString().split('T')[0];
            }

            function saveToLocalStorage(){
                localStorage.setItem('my_transactions', JSON.stringify(transactions));
            }

            function updateUI(){
                const tbody = document.getElementById('transaction-list');
                const totalSpan = document.getElementById('total');
                const selectedMonth = document.getElementById('month-filter').value

                tbody.innerHTML = '';
                let monthBalance = 0;
                
                transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

                transactions.forEach((t) => {
                    if (!selectedMonth || t.date.slice(0, 7) === selectedMonth) {
                        monthBalance += t.amount;

                        const dateParts = t.date.split('-');
                        const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}`;

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${formattedDate}</td>
                            <td>${t.desc}</td>
                            <td style="color: ${t.amount < 0 ? '#dc3545' : '#28a745'}; font-weight: bold;">
                                ${t.amount.toFixed(2)} €
                            </td>
                            <td>
                             <button class="btn-delete" onclick="deleteTransaction(${t.id})">X</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    }
                });
                totalSpan.innerText = monthBalance.toFixed(2);
                totalSpan.style.color = monthBalance < 0 ? '#dc3545' : '#28a745';
            }

            function deleteTransaction(id){
                transactions = transactions.filter(t => t.id !== id);
                saveToLocalStorage();
                updateUI();
            }
        </script>
    </body>
</html>
