<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cells</title>

    <style>
      /* --- 1. ALLGEMEINES LAYOUT & CARDS --- */
      body {
        font-family: Helvetica, sans-serif;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        font-size: 16px;
        background-color: #f6f6f6;
      }

      .card {
        background: #edede9;
        padding: 18px;
        border-radius: 20px;
        margin-bottom: 20px;
      }

      /* --- 2. FORMULAR-ELEMENTE & BUTTONS --- */
      input,
      select,
      button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        font-family: inherit; /* <- neu */
        height: 48px;
        padding: 0 12px;
        margin: 6px 0;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        font-size: 16px; /* Verhindert Auto-Zoom auf Safari iOS */
        background-color: #ffffff;
      }

      button {
        background-color: #40916c;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-secondary {
        background-color: #ffffff;
        color: #40916c;
        border: 1px solid #40916c;
      }

      .btn-delete {
        background-color: #c52233 !important;
        color: white !important;
        width: auto !important;
        height: auto !important;
        padding: 6px 12px !important;
        font-size: 12px !important;
      }

      /* Zentrieren von Text in Datums-Inputs */
      input[type="date"],
      input[type="month"] {
        color: #000000;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 48px;
        font-size: 16px;
      }

      input[type="date"]::-webkit-date-and-time-value,
      input[type="month"]::-webkit-date-and-time-value {
        text-align: center;
        color: #000000;
        margin: auto;
      }

      /* Grid für die Info-Boxen */
      .stats-grid {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .stat-box {
        flex: 1;
        min-width: 0;
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* Spezielles schmälere (dünnere) Info-Box */
      .stat-box-thin {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 4px 8px;
        text-align: center;
        margin-top: 10px;
      }

      .stat-box label,
      .stat-box-thin label {
        display: block;
        font-size: 11px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .stat-box span,
      .stat-box-thin span {
        font-size: 15px;
        font-weight: bold;
        color: #32a74a;
      }

      /* --- 3. DASHBOARD GRID LAYOUT --- */
      .dashboard-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .dashboard-row {
        display: flex;
        gap: 10px;
      }

      .dashboard-box-large {
        flex: 2;
        min-height: 110px;
      }

      .dashboard-box-tall {
        flex: 1;
        min-height: 110px;
      }

      .dashboard-box-small {
        flex: 1;
        min-height: 44px;
      }

      /* Spalte für Sparziel + Progress-Box (min-width: 0 verhindert den Überlauf) */
      .savings-goal-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .savings-goal-box {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 10px 4px;
        min-width: 0;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 105px;
      }

      .savings-goal-box label {
        display: block;
        font-size: 11px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 2px;
      }

      /* Ladebalken & Prozentzahl */
      .progress-box {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 8px 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background-color: #edede9;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 4px;
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background-color: #40916c;
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      .progress-text {
        font-size: 12px;
        font-weight: bold;
        color: #666;
      }

      /* Dropdown (Accordion) für Savings */
      details.savings-dropdown {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 10px 14px;
        margin-top: 5px;
      }

      details.savings-dropdown summary {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        cursor: pointer;
        outline: none;
        text-align: center;
        list-style: none;
      }

      details.savings-dropdown summary::-webkit-details-marker {
        display: none;
      }

      details.savings-dropdown[open] summary {
        margin-bottom: 12px;
      }

      .savings-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid #f0eee9;
        padding-top: 10px;
      }

      /* Felder im Savings-Dropdown: etwas grauer als der weiße Dropdown-Hintergrund */
      .savings-content .stat-box,
      .savings-content .savings-goal-box,
      .savings-content .progress-box {
        background: #f3f3f1;
      }

      .savings-content .progress-bar-bg {
        background-color: #dedcd7;
      }

      /* Interaktive Input-Felder im Dashboard */
      .dash-input,
      .salary-input {
        width: 100% !important;
        min-width: 0;
        height: auto !important;
        margin: 0 !important;
        padding: 2px 0 !important;
        border: none !important;
        background: transparent !important;
        text-align: center !important;
        font-size: 16px !important;
        font-weight: bold !important;
      }

      .dash-input:focus,
      .salary-input:focus {
        outline: none;
        background: #ffffff !important;
        border-radius: 18px;
      }

      /* Kleinere Beträge in den drei Sparziel-Feldern */
      .savings-goal-box .dash-input {
        font-size: 14px !important;
      }

      .savings-goal-box .goal-input {
        font-size: 12px !important;
        color: #666 !important;
        height: 22px !important;
        padding: 0 !important;
        margin-top: 2px !important;
      }

      /* Farbvarianten für Income & Expenses */
      .expenses-val {
        color: #c52233 !important;
        font-weight: bold;
        font-size: 16px;
      }

      .income-val {
        color: #32a74a !important;
        font-weight: bold;
        font-size: 16px;
      }

      /* --- 4. TABELLEN-STYLING --- */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 16px;
      }

      th,
      td {
        border: 1px solid #d6ccc2;
        padding: 10px 8px;
        text-align: left;
      }

      table input[type="date"] {
        width: 100% !important;
        height: auto !important;
        min-height: 36px !important;
        padding: 4px 6px !important;
        line-height: normal !important;
        display: inline-block !important;
        font-size: 15px !important;
      }

      .custom-label {
        text-align: center;
        text-transform: uppercase;
        color: #666;
        font-weight: bold;
        font-size: 12px;
        margin-top: 0px;
      }

      .custom-label2 {
        color: #666;
        font-weight: bold;
        font-size: 16px;
        margin-top: 0px;
      }

      .backup-info {
        text-align: center;
        font-size: 12px;
        color: #666;
        margin: 8px 0 0;
      }
    </style>
  </head>

  <body>
    <!-- ========================================== -->
    <!-- ANSICHT 1: DASHBOARD                      -->
    <!-- ========================================== -->
    <div id="dashboard-view" style="display: block">
      <h2>Welcome to Cells</h2>

      <div class="card">
        <div class="dashboard-grid">
          <div class="dashboard-row">
            <div class="stat-box dashboard-box-large">
              <label>Total</label>
              <span
                id="dash-total-val"
                style="font-size: 20px; font-weight: bold"
                >0,00€</span
              >
            </div>
            <div class="stat-box dashboard-box-tall">
              <label>This Month</label>
              <input
                type="text"
                id="dash-this-month"
                class="dash-input"
                placeholder="0,00€"
              />
            </div>
          </div>

          <div class="dashboard-row">
            <div class="stat-box dashboard-box-small">
              <label>Cash</label>
              <input
                type="text"
                id="dash-top-cash"
                class="dash-input"
                placeholder="0,00€"
              />
            </div>
            <div class="stat-box dashboard-box-small">
              <label>Paypal</label>
              <input
                type="text"
                id="dash-paypal"
                class="dash-input"
                placeholder="0,00€"
              />
            </div>
          </div>

          <details class="savings-dropdown">
            <summary>Savings</summary>
            <div class="savings-content">
              <div class="dashboard-row">
                <div class="stat-box" style="flex: 1; min-height: 50px">
                  <label>Total Savings</label>
                  <span
                    id="dash-savings-val"
                    style="font-size: 18px; font-weight: bold"
                    >0,00€</span
                  >
                </div>
              </div>

              <div class="dashboard-row">
                <div class="stat-box dashboard-box-small">
                  <label>Bank Savings</label>
                  <input
                    type="text"
                    id="dash-bank-savings"
                    class="dash-input"
                    placeholder="0,00€"
                  />
                </div>
              </div>

              <div class="dashboard-row">
                <div class="stat-box dashboard-box-small">
                  <label>Cash Savings</label>
                  <input
                    type="text"
                    id="dash-cash-savings"
                    class="dash-input"
                    placeholder="0,00€"
                  />
                </div>
              </div>

              <!-- Sparziele (werden per JS aus GOALS erzeugt) -->
              <div class="dashboard-row" id="goals-row"></div>
            </div>
          </details>
        </div>
      </div>

      <div class="card" style="text-align: center; margin-top: 20px">
        <button onclick="showMainView()" style="padding: 12px; font-size: 16px">
          Monthly Overview
        </button>
      </div>

      <!-- BACKUP -->
      <div class="card">
        <button onclick="exportBackup()">Download Backup</button>
        <button
          class="btn-secondary"
          onclick="document.getElementById('backup-file').click()"
        >
          Restore Backup
        </button>
        <input
          type="file"
          id="backup-file"
          accept=".json,application/json"
          style="display: none"
        />
        <p class="backup-info" id="backup-info"></p>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- ANSICHT 2: MONATSÜBERSICHT                 -->
    <!-- ========================================== -->
    <div id="main-view" style="display: none">
      <button
        onclick="showDashboard()"
        style="
          background-color: #40916c;
          width: auto;
          margin-bottom: 15px;
          padding: 6px 12px;
        "
      >
        Dashboard
      </button>

      <div class="filter-selection">
        <input type="month" id="month-filter" onchange="onMonthChange()" />
      </div>

      <div class="card">
        <p class="custom-label">Earned this month</p>
        <div class="stat-box" style="margin-bottom: 10px">
          <label>Salary</label>
          <input
            type="text"
            id="monthly-salary"
            class="salary-input"
            placeholder="0,00€"
          />
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <label>Cash</label>
            <span id="cash-total">0,00€</span>
          </div>
          <div class="stat-box">
            <label id="dynamic-label">Plasma</label>
            <span id="plasma-total">0,00€</span>
          </div>
        </div>

        <div class="stat-box-thin">
          <label>Total</label>
          <span id="cash-plasma-sum">0,00€</span>
        </div>
      </div>

      <div class="card">
        <div class="stats-grid">
          <div class="stat-box">
            <label>Total Income</label>
            <span id="total-income" class="income-val">0,00€</span>
          </div>
          <div class="stat-box">
            <label>Total Expenses</label>
            <span id="total-expenses" class="expenses-val">0,00€</span>
          </div>
        </div>

        <div class="stat-box-thin">
          <label>Net Total</label>
          <span id="net-total">0,00€</span>
        </div>
      </div>

      <div class="card">
        <h3 class="custom-label2">Sum: <span id="total">0,00€</span></h3>
        <input type="text" id="desc" placeholder="Description" />
        <input type="number" step="any" id="amount" placeholder="Amount" />
        <input type="date" id="date" />
        <button onclick="addTransaction()">Add Transaction</button>
      </div>

      <div style="margin-bottom: 10px; display: flex; gap: 10px">
        <button
          onclick="undo()"
          style="
            background-color: #40916c;
            height: 32px;
            width: 48px;
            padding: 2px 8px;
            font-size: 14px;
          "
        >
          ←
        </button>
        <button
          onclick="redo()"
          style="
            background-color: #40916c;
            height: 32px;
            width: 48px;
            padding: 2px 8px;
            font-size: 14px;
          "
        >
          →
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->
    <script>
      const $ = (id) => document.getElementById(id);

      // --- 1. KONSTANTEN ---
      const GOALS = [
        ["travels", "Travels"],
        ["studies", "Studies"],
        ["car", "Car"],
      ];
      const GREEN = "#32a74a",
        RED = "#c52233",
        GREY = "#666666";
      // Felder, die bei 0 grau statt grün sind
      const GREY_ZERO = [
        "dash-travels",
        "dash-studies",
        "dash-car",
        "dash-bank-savings",
        "dash-cash-savings",
      ];

      // --- 2. ZAHLEN & DATUM (Format: 1.324,54€) ---
      // Versteht "1324,54", "1.324,54", "1324.54" und "1,324.54"
      function parseNum(str) {
        if (str === null || str === undefined) return NaN;
        let s = String(str).replace(/[^0-9.,-]/g, "");
        if (!s || s === "-") return NaN;
        const lc = s.lastIndexOf(","),
          ld = s.lastIndexOf(".");
        if (lc > -1 && ld > -1) {
          s =
            lc > ld
              ? s.replace(/\./g, "").replace(",", ".")
              : s.replace(/,/g, "");
        } else if (lc > -1) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else if (ld > -1) {
          if (s.split(".").length > 2 || /^-?[1-9]\d{0,2}\.\d{3}$/.test(s))
            s = s.replace(/\./g, "");
        }
        return parseFloat(s);
      }

      // Normalisiert zum Speichern: "1.324,5" -> "1324.5" (auf 2 Nachkommastellen gerundet)
      function cleanNumber(str) {
        const n = parseNum(str);
        return isNaN(n) ? "" : String(Math.round(n * 100) / 100);
      }

      // Anzeige: 1324.5 -> "1.324,50€"
      function fmt(n) {
        const neg = n < 0 && Math.abs(n) >= 0.005;
        const [i, d] = Math.abs(n).toFixed(2).split(".");
        return (
          (neg ? "-" : "") +
          i.replace(/\B(?=(\d{3})+(?!\d))/g, ".") +
          "," +
          d +
          "€"
        );
      }

      // Beim Bearbeiten: "1324,5" (ohne Tausenderpunkte und €)
      function editStr(str) {
        return cleanNumber(str).replace(".", ",");
      }

      // Lokales Datum (nicht UTC) -> wechselt genau um 0:00 Uhr
      function localDate(d = new Date()) {
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function colorFor(n) {
        return n < 0 ? RED : GREEN;
      }

      // --- 3. STATE & INITIALISIERUNG ---
      let transactions =
        JSON.parse(localStorage.getItem("my_transactions")) || [];
      let historyStack = [];
      let redoStack = [];
      let lastDay = localDate();

      // Sparziel-Spalten erzeugen
      $("goals-row").innerHTML = GOALS.map(
        ([key, label]) => `
        <div class="savings-goal-col">
          <div class="savings-goal-box">
            <label>${label}</label>
            <input type="text" id="dash-${key}" class="dash-input" placeholder="0,00€" />
            <input type="text" id="goal-${key}" class="dash-input goal-input" placeholder="0,00€" />
          </div>
          <div class="progress-box">
            <div class="progress-bar-bg"><div id="bar-${key}" class="progress-bar-fill"></div></div>
            <span id="pct-${key}" class="progress-text">0%</span>
          </div>
        </div>`,
      ).join("");

      $("date").value = lastDay;
      $("month-filter").value = lastDay.slice(0, 7);

      // Eingabefelder (Dashboard + Gehalt): beim Fokus Rohwert, beim Verlassen speichern
      document.querySelectorAll(".dash-input").forEach((input) => {
        input.addEventListener("focus", () => {
          input.value = editStr(input.value);
          if (!input.id.startsWith("goal-")) input.style.color = "#000000";
        });
        input.addEventListener("blur", saveDashboardData);
        input.addEventListener(
          "keydown",
          (e) => e.key === "Enter" && input.blur(),
        );
      });
      $("monthly-salary").addEventListener("focus", () => {
        const i = $("monthly-salary");
        i.value = editStr(i.value);
        i.style.color = "#000000";
      });
      $("monthly-salary").addEventListener("blur", saveMonthlySalary);
      $("monthly-salary").addEventListener(
        "keydown",
        (e) => e.key === "Enter" && e.target.blur(),
      );

      // Datum wechselt um Mitternacht (auch wenn die App im Hintergrund war)
      function checkNewDay() {
        const now = localDate();
        if (now === lastDay) return;
        if ($("date").value === lastDay) $("date").value = now;
        lastDay = now;
      }
      setInterval(checkNewDay, 15000);
      document.addEventListener("visibilitychange", checkNewDay);

      // Browser bitten, den Speicher nicht automatisch zu löschen
      try {
        navigator.storage &&
          navigator.storage.persist &&
          navigator.storage.persist();
      } catch (e) {}

      loadMonthlySalary();
      loadDashboardData();
      renderBackupInfo();
      updateUI();

      // --- 4. SPEICHER-FUNKTIONEN ---
      function saveState() {
        historyStack.push(JSON.stringify(transactions));
        redoStack = [];
      }

      function saveAndRefresh() {
        localStorage.setItem("my_transactions", JSON.stringify(transactions));
        updateUI();
      }

      // --- 5. DASHBOARD ---
      function dashIds() {
        return [...document.querySelectorAll(".dash-input")].map((i) => i.id);
      }
      function keyOf(id) {
        return id.replace(/-/g, "_");
      }
      function stored(id) {
        return parseFloat(localStorage.getItem(keyOf(id))) || 0;
      }

      function saveDashboardData() {
        dashIds().forEach((id) =>
          localStorage.setItem(keyOf(id), cleanNumber($(id).value)),
        );
        renderDashboard();
      }

      function loadDashboardData() {
        dashIds().forEach(
          (id) => ($(id).value = localStorage.getItem(keyOf(id)) || ""),
        );
        renderDashboard();
      }

      function updateProgress(current, goal, key) {
        const pct = goal > 0 && current > 0 ? (current / goal) * 100 : 0;
        $("bar-" + key).style.width = Math.min(Math.max(pct, 0), 100) + "%";
        $("pct-" + key).innerText = Math.round(pct) + "%";
      }

      function renderDashboard() {
        dashIds().forEach((id) => {
          const raw = localStorage.getItem(keyOf(id));
          const n = parseFloat(raw);
          const input = $(id);
          input.value = raw !== null && raw !== "" && !isNaN(n) ? fmt(n) : "";
          if (id.startsWith("goal-")) return;
          input.style.color = GREY_ZERO.includes(id)
            ? n > 0
              ? GREEN
              : n < 0
                ? RED
                : GREY
            : colorFor(n || 0);
        });

        GOALS.forEach(([key]) =>
          updateProgress(stored("dash-" + key), stored("goal-" + key), key),
        );

        const totalSavings =
          stored("dash-bank-savings") + stored("dash-cash-savings");
        const totalAssets =
          stored("dash-this-month") +
          stored("dash-top-cash") +
          stored("dash-paypal") +
          totalSavings;

        $("dash-savings-val").innerText = fmt(totalSavings);
        $("dash-savings-val").style.color = colorFor(totalSavings);
        $("dash-total-val").innerText = fmt(totalAssets);
        $("dash-total-val").style.color = colorFor(totalAssets);
      }

      // --- 6. BACKUP ---
      function exportBackup() {
        localStorage.setItem("last_backup", localDate());
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          data[k] = localStorage.getItem(k);
        }
        const blob = new Blob(
          [JSON.stringify({ app: "cells", version: 1, data }, null, 2)],
          { type: "application/json" },
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `cells-backup-${localDate()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        renderBackupInfo();
      }

      $("backup-file").addEventListener("change", (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const obj = JSON.parse(reader.result);
            if (!obj || obj.app !== "cells" || typeof obj.data !== "object")
              throw new Error("invalid");
            if (
              !confirm(
                "This replaces ALL current data with the backup. Continue?",
              )
            )
              return;
            localStorage.clear();
            Object.entries(obj.data).forEach(([k, v]) =>
              localStorage.setItem(k, v),
            );
            location.reload();
          } catch (err) {
            alert("This file is not a valid Cells backup.");
          }
        };
        reader.readAsText(file);
      });

      function renderBackupInfo() {
        const last = localStorage.getItem("last_backup");
        const el = $("backup-info");
        if (!last) {
          el.innerText = "No backup yet";
          el.style.color = RED;
          return;
        }
        const days = Math.floor(
          (new Date(localDate()) - new Date(last)) / 86400000,
        );
        const [y, m, d] = last.split("-");
        el.innerText = `Last backup: ${d}.${m}.${y}`;
        el.style.color = days > 30 ? RED : GREY;
      }

      // --- 7. GEHALT ---
      function applySalaryDisplay(num) {
        const input = $("monthly-salary");
        if (num === "" || isNaN(num)) {
          input.value = "";
          input.style.color = GREEN;
        } else {
          input.value = fmt(num);
          input.style.color = colorFor(num);
        }
      }

      function saveMonthlySalary() {
        const month = $("month-filter").value;
        const val = cleanNumber($("monthly-salary").value);
        if (month) {
          if (val !== "") localStorage.setItem(`salary_${month}`, val);
          else localStorage.removeItem(`salary_${month}`);
        }
        applySalaryDisplay(val === "" ? "" : parseFloat(val));
        updateUI();
      }

      function loadMonthlySalary() {
        const saved = localStorage.getItem(`salary_${$("month-filter").value}`);
        applySalaryDisplay(saved === null ? "" : parseFloat(saved));
        checkDynamicLabel();
      }

      function checkDynamicLabel() {
        const month = $("month-filter").value;
        $("dynamic-label").innerText =
          month && month >= "2026-11" ? "Tips" : "Plasma";
      }

      function onMonthChange() {
        loadMonthlySalary();
        updateUI();
      }

      // --- 8. NAVIGATION ---
      function showMainView() {
        $("dashboard-view").style.display = "none";
        $("main-view").style.display = "block";
        checkDynamicLabel();
      }

      function showDashboard() {
        $("main-view").style.display = "none";
        $("dashboard-view").style.display = "block";
        renderDashboard();
      }

      // --- 9. TRANSAKTIONEN ---
      function addTransaction() {
        const desc = $("desc").value;
        const amount = parseFloat($("amount").value);
        const date = $("date").value;

        if (!desc || isNaN(amount) || !date) {
          alert("Please enter a valid Description and Amount");
          return;
        }

        saveState();
        transactions.push({ id: Date.now(), desc, amount, date });

        $("month-filter").value = date.slice(0, 7);
        loadMonthlySalary();
        saveAndRefresh();

        $("desc").value = "";
        $("amount").value = "";
        $("date").value = localDate();
        lastDay = localDate();
      }

      function deleteTransaction(id) {
        if (!confirm("Do you really want to remove this transaction?")) return;
        saveState();
        transactions = transactions.filter((t) => t.id !== id);
        saveAndRefresh();
      }

      function updateTransactionDate(id, newDate) {
        if (!newDate) return;
        saveState();
        const t = transactions.find((t) => t.id === id);
        if (t) {
          t.date = newDate;
          saveAndRefresh();
        }
      }

      // --- 10. UNDO / REDO ---
      function undo() {
        if (historyStack.length === 0) return;
        redoStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(historyStack.pop());
        saveAndRefresh();
      }

      function redo() {
        if (redoStack.length === 0) return;
        historyStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(redoStack.pop());
        saveAndRefresh();
      }

      // --- 11. UI & SUMMEN ---
      function updateUI() {
        const tbody = $("transaction-list");
        const selectedMonth = $("month-filter").value;
        checkDynamicLabel();

        tbody.innerHTML = "";
        let monthBalance = 0,
          cashTotal = 0,
          secondaryTotal = 0,
          totalExpenses = 0,
          totalIncome = 0;

        const savedSalary = parseFloat(
          localStorage.getItem(`salary_${selectedMonth}`),
        );
        if (!isNaN(savedSalary)) totalIncome += savedSalary;

        const secondaryKeyword = selectedMonth >= "2026-11" ? "tips" : "plasma";

        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        transactions.forEach((t) => {
          if (selectedMonth && t.date.slice(0, 7) !== selectedMonth) return;

          monthBalance += t.amount;
          if (t.amount < 0) totalExpenses += Math.abs(t.amount);
          else totalIncome += t.amount;

          const descLower = t.desc.toLowerCase();
          if (descLower.includes("cash") && t.amount > 0) cashTotal += t.amount;
          if (descLower.includes(secondaryKeyword) && t.amount > 0)
            secondaryTotal += t.amount;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td><input type="date" value="${t.date}" onchange="updateTransactionDate(${t.id}, this.value)"></td>
            <td>${esc(t.desc)}</td>
            <td style="color: ${colorFor(t.amount)}; font-weight: bold;">${fmt(t.amount)}</td>
            <td><button class="btn-delete" onclick="deleteTransaction(${t.id})">X</button></td>
          `;
          tbody.appendChild(row);
        });

        $("total").innerText = fmt(monthBalance);
        $("total").style.color = colorFor(monthBalance);
        $("cash-total").innerText = fmt(cashTotal);
        $("plasma-total").innerText = fmt(secondaryTotal);
        $("cash-plasma-sum").innerText = fmt(cashTotal + secondaryTotal);
        $("total-expenses").innerText = fmt(totalExpenses);
        $("total-income").innerText = fmt(totalIncome);

        const net = totalIncome - totalExpenses;
        $("net-total").innerText = fmt(net);
        $("net-total").style.color = colorFor(net);
      }
    </script>
  </body>
</html>
