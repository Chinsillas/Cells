<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cells</title>

    <style>
      /* --- 1. ALLGEMEINES LAYOUT & CARDS --- */
      body {
        font-family: Helvetica, sans-serif;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        font-size: 16px;
        background-color: #f6f6f6;
      }

      .card {
        background: #edede9;
        padding: 18px;
        border-radius: 20px;
        margin-bottom: 20px;
      }

      /* --- 2. FORMULAR-ELEMENTE & BUTTONS --- */
      input,
      select,
      button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        height: 48px;
        padding: 0 12px;
        margin: 6px 0;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        font-size: 16px; /* Verhindert Auto-Zoom auf Safari iOS */
        background-color: #ffffff;
      }

      button {
        background-color: #40916c;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-delete {
        background-color: #c52233 !important;
        color: white !important;
        width: auto !important;
        height: auto !important;
        padding: 6px 12px !important;
        font-size: 12px !important;
      }

      /* Zentrieren von Text in Datums-Inputs */
      input[type="date"],
      input[type="month"] {
        color: #000000;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 48px;
        font-size: 16px;
      }

      input[type="date"]::-webkit-date-and-time-value,
      input[type="month"]::-webkit-date-and-time-value {
        text-align: center;
        color: #000000;
        margin: auto;
      }

      /* Grid für die Info-Boxen */
      .stats-grid {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .stat-box {
        flex: 1;
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* Spezielles schmälere (dünnere) Info-Box */
      .stat-box-thin {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 4px 8px;
        text-align: center;
        margin-top: 10px;
      }

      .stat-box label,
      .stat-box-thin label {
        display: block;
        font-size: 11px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .stat-box span,
      .stat-box-thin span {
        font-size: 15px;
        font-weight: bold;
        color: #32a74a;
      }

      /* --- 3. DASHBOARD GRID LAYOUT --- */
      .dashboard-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .dashboard-row {
        display: flex;
        gap: 10px;
      }

      .dashboard-column {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }

      .dashboard-box-large {
        flex: 2;
        min-height: 110px;
      }

      .dashboard-box-tall {
        flex: 1;
        min-height: 110px;
      }

      .dashboard-box-square {
        flex: 1;
        min-height: 120px;
      }

      .dashboard-box-small {
        flex: 1;
        min-height: 55px;
      }

      /* Interaktive Input-Felder im Dashboard */
      .dash-input {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 2px 0 !important;
        border: none !important;
        background: transparent !important;
        text-align: center !important;
        font-size: 16px !important;
        font-weight: bold !important;
        color: #32a74a !important;
      }

      .dash-input:focus {
        outline: none;
        background: #ffffff !important;
        border-radius: 18px;
      }

      .salary-input {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 2px 0 !important;
        border: none !important;
        background: transparent !important;
        text-align: center !important;
        font-size: 16px !important;
        font-weight: bold !important;
        color: #32a74a !important;
      }

      .salary-input:focus {
        outline: none;
        background: #ffffff !important;
        border-radius: 18px;
      }

      /* Farbvarianten für Income & Expenses */
      .expenses-val {
        color: #c52233 !important;
        font-weight: bold;
        font-size: 16px;
      }

      .income-val {
        color: #32a74a !important;
        font-weight: bold;
        font-size: 16px;
      }

      /* --- 4. TABELLEN-STYLING --- */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 16px;
      }

      th,
      td {
        border: 1px solid #d6ccc2;
        padding: 10px 8px;
        text-align: left;
      }

      /* Styling für das Datums-Auswahlfeld in der Tabelle */
      table input[type="date"] {
        width: 100% !important;
        height: auto !important;
        min-height: 36px !important;
        padding: 4px 6px !important;
        line-height: normal !important;
        display: inline-block !important;
        font-size: 15px !important;
      }
    </style>
  </head>

  <body>
    <!-- ========================================== -->
    <!-- ANSICHT 1: DASHBOARD                      -->
    <!-- ========================================== -->
    <div id="dashboard-view" style="display: block">
      <h2>Welcome to Cells</h2>
      <p>Your personal finance tracker.</p>

      <!-- DASHBOARD LAYOUT GRID BASIERT AUF DER SKIZZE -->
      <div class="card">
        <div class="dashboard-grid">
          <!-- OBERER BEREICH -->
          <div class="dashboard-row">
            <!-- Total (Horizontal / Groß) -->
            <div class="stat-box dashboard-box-large">
              <label>Total</label>
              <span
                id="dash-total-val"
                style="font-size: 20px; font-weight: bold; color: #32a74a"
                >0.00€</span
              >
            </div>

            <!-- This Month (Vertikal / Hoch) -->
            <div class="stat-box dashboard-box-tall">
              <label>This Month</label>
              <input
                type="text"
                id="dash-this-month"
                class="dash-input"
                placeholder="0.00€"
                onfocus="onDashInputFocus('dash-this-month')"
                onblur="onDashInputBlur('dash-this-month')"
                onchange="saveDashboardData()"
              />
            </div>
          </div>

          <!-- UNTERER BEREICH -->
          <div class="dashboard-row">
            <!-- Total Savings (Quadratisch) -->
            <div class="stat-box dashboard-box-square">
              <label>Total Savings</label>
              <span
                id="dash-savings-val"
                style="font-size: 18px; font-weight: bold; color: #32a74a"
                >0.00€</span
              >
            </div>

            <!-- Rechts: Bank Account & Cash untereinander -->
            <div class="dashboard-column">
              <div class="stat-box dashboard-box-small">
                <label>Bank Account</label>
                <input
                  type="text"
                  id="dash-bank"
                  class="dash-input"
                  placeholder="0.00€"
                  onfocus="onDashInputFocus('dash-bank')"
                  onblur="onDashInputBlur('dash-bank')"
                  onchange="saveDashboardData()"
                />
              </div>

              <div class="stat-box dashboard-box-small">
                <label>Cash</label>
                <input
                  type="text"
                  id="dash-cash"
                  class="dash-input"
                  placeholder="0.00€"
                  onfocus="onDashInputFocus('dash-cash')"
                  onblur="onDashInputBlur('dash-cash')"
                  onchange="saveDashboardData()"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="text-align: center; margin-top: 20px">
        <button onclick="showMainView()" style="padding: 12px; font-size: 16px">
          Monthly Overview
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- ANSICHT 2: MONATSÜBERSICHT                 -->
    <!-- ========================================== -->
    <div id="main-view" style="display: none">
      <button
        onclick="showDashboard()"
        style="
          background-color: #40916c;
          width: auto;
          margin-bottom: 15px;
          padding: 6px 12px;
        "
      >
        Dashboard
      </button>

      <div class="filter-selection">
        <input type="month" id="month-filter" onchange="onMonthChange()" />
      </div>

      <!-- GEHALT & KATEGORIEN INFO CARD -->
      <div class="card">
        <!-- Längliches Gehalts-Feld oben -->
        <div class="stat-box" style="margin-bottom: 10px">
          <label>Monthly Salary</label>
          <input
            type="text"
            id="monthly-salary"
            class="salary-input"
            placeholder="0.00€"
            onfocus="onSalaryFocus()"
            onblur="onSalaryBlur()"
            onchange="saveMonthlySalary()"
          />
        </div>

        <!-- Cash Inflow & Plasma Donation nebeneinander -->
        <div class="stats-grid">
          <div class="stat-box">
            <label>Cash</label>
            <span id="cash-total">0.00€</span>
          </div>
          <div class="stat-box">
            <label>Plasma</label>
            <span id="plasma-total">0.00€</span>
          </div>
        </div>

        <div class="stat-box-thin">
          <label>Total</label>
          <span id="cash-plasma-sum">0.00€</span>
        </div>
      </div>

      <!-- TOTAL INCOME & TOTAL EXPENSES CARD -->
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box">
            <label>Total Income</label>
            <span id="total-income" class="income-val">0.00€</span>
          </div>
          <div class="stat-box">
            <label>Total Expenses</label>
            <span id="total-expenses" class="expenses-val">0.00€</span>
          </div>
        </div>

        <div class="stat-box-thin">
          <label>Net Total</label>
          <span id="net-total">0.00€</span>
        </div>
      </div>

      <div class="card">
        <h3>Sum: <span id="total">0.00€</span></h3>
        <input type="text" id="desc" placeholder="Description" />
        <input type="number" id="amount" placeholder="Amount" />
        <input type="date" id="date" />
        <button onclick="addTransaction()">Add Transaction</button>
      </div>

      <div style="margin-bottom: 10px; display: flex; gap: 10px">
        <button
          onclick="undo()"
          style="
            background-color: #40916c;
            height: 32px;
            width: 48px;
            padding: 2px 8px;
            font-size: 14px;
          "
        >
          ←
        </button>
        <button
          onclick="redo()"
          style="
            background-color: #40916c;
            height: 32px;
            width: 48px;
            padding: 2px 8px;
            font-size: 14px;
          "
        >
          →
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->
    <script>
      // --- 1. STATE & INITIALISIERUNG ---
      let transactions =
        JSON.parse(localStorage.getItem("my_transactions")) || [];
      let historyStack = [];
      let redoStack = [];

      const today = new Date();
      document.getElementById("date").value = today.toISOString().split("T")[0];
      document.getElementById("month-filter").value = today
        .toISOString()
        .slice(0, 7);

      loadMonthlySalary();
      loadDashboardData();
      updateUI();

      // --- 2. SPEICHER- & HILFSFUNKTIONEN ---
      function saveState() {
        historyStack.push(JSON.stringify(transactions));
        redoStack = [];
      }

      function saveAndRefresh() {
        localStorage.setItem("my_transactions", JSON.stringify(transactions));
        updateUI();
      }

      // --- 3. DASHBOARD LOGIK ---
      function saveDashboardData() {
        const thisMonthVal = cleanNumber(
          document.getElementById("dash-this-month").value,
        );
        const bankVal = cleanNumber(document.getElementById("dash-bank").value);
        const cashVal = cleanNumber(document.getElementById("dash-cash").value);

        localStorage.setItem("dash_this_month", thisMonthVal);
        localStorage.setItem("dash_bank", bankVal);
        localStorage.setItem("dash_cash", cashVal);

        renderDashboard();
      }

      function loadDashboardData() {
        document.getElementById("dash-this-month").value =
          localStorage.getItem("dash_this_month") || "";
        document.getElementById("dash-bank").value =
          localStorage.getItem("dash_bank") || "";
        document.getElementById("dash-cash").value =
          localStorage.getItem("dash_cash") || "";

        renderDashboard();
      }

      function renderDashboard() {
        const thisMonthVal =
          parseFloat(localStorage.getItem("dash_this_month")) || 0;
        const bankVal = parseFloat(localStorage.getItem("dash_bank")) || 0;
        const cashVal = parseFloat(localStorage.getItem("dash_cash")) || 0;

        formatDashInput(
          "dash-this-month",
          localStorage.getItem("dash_this_month"),
        );
        formatDashInput("dash-bank", localStorage.getItem("dash_bank"));
        formatDashInput("dash-cash", localStorage.getItem("dash_cash"));

        const totalSavings = bankVal + cashVal;
        const totalAssets = thisMonthVal + totalSavings;

        document.getElementById("dash-savings-val").innerText =
          totalSavings.toFixed(2) + "€";
        document.getElementById("dash-total-val").innerText =
          totalAssets.toFixed(2) + "€";

        const totalSpan = document.getElementById("dash-total-val");
        totalSpan.style.color = totalAssets < 0 ? "#c52233" : "#32a74a";
      }

      function cleanNumber(str) {
        if (!str) return "";
        return str.replace(/[^0-9.,-]/g, "").replace(",", ".");
      }

      function formatDashInput(elementId, valStr) {
        const input = document.getElementById(elementId);
        const clean = cleanNumber(valStr);
        if (clean !== "" && !isNaN(parseFloat(clean))) {
          input.value = parseFloat(clean).toFixed(2) + "€";
        } else {
          input.value = "";
        }
      }

      function onDashInputFocus(elementId) {
        const input = document.getElementById(elementId);
        input.value = cleanNumber(input.value);
      }

      function onDashInputBlur(elementId) {
        saveDashboardData();
      }

      // --- 4. GEHALTS-LOGIK ---
      function saveMonthlySalary() {
        const month = document.getElementById("month-filter").value;
        const input = document.getElementById("monthly-salary");
        let cleanVal = cleanNumber(input.value);

        if (month) {
          if (cleanVal !== "") {
            localStorage.setItem(`salary_${month}`, cleanVal);
          } else {
            localStorage.removeItem(`salary_${month}`);
          }
        }
        formatSalaryDisplay();
        updateUI();
      }

      function loadMonthlySalary() {
        const month = document.getElementById("month-filter").value;
        const savedSalary = localStorage.getItem(`salary_${month}`) || "";
        document.getElementById("monthly-salary").value = savedSalary;
        formatSalaryDisplay();
      }

      function formatSalaryDisplay() {
        const input = document.getElementById("monthly-salary");
        let val = cleanNumber(input.value);
        if (val !== "" && !isNaN(parseFloat(val))) {
          input.value = parseFloat(val).toFixed(2) + "€";
        } else {
          input.value = "";
        }
      }

      function onSalaryFocus() {
        const input = document.getElementById("monthly-salary");
        input.value = cleanNumber(input.value);
      }

      function onSalaryBlur() {
        saveMonthlySalary();
      }

      function onMonthChange() {
        loadMonthlySalary();
        updateUI();
      }

      // --- 5. NAVIGATION (ANSICHTEN UMSCHALTEN) ---
      function showMainView() {
        document.getElementById("dashboard-view").style.display = "none";
        document.getElementById("main-view").style.display = "block";
      }

      function showDashboard() {
        document.getElementById("main-view").style.display = "none";
        document.getElementById("dashboard-view").style.display = "block";
        renderDashboard();
      }

      // --- 6. TRANSAKTIONEN VERWALTEN ---
      function addTransaction() {
        const descInput = document.getElementById("desc");
        const amountInput = document.getElementById("amount");
        const dateInput = document.getElementById("date");

        const desc = descInput.value;
        const amount = parseFloat(amountInput.value);
        const date = dateInput.value;

        if (!desc || isNaN(amount) || !date) {
          alert("Please enter a valid Description and Amount");
          return;
        }

        saveState();

        transactions.push({ id: Date.now(), desc, amount, date });

        document.getElementById("month-filter").value = date.slice(0, 7);
        loadMonthlySalary();

        saveAndRefresh();

        descInput.value = "";
        amountInput.value = "";
        dateInput.value = today.toISOString().split("T")[0];
      }

      function deleteTransaction(id) {
        if (!confirm("Do you really want to remove this transaction?")) return;

        saveState();
        transactions = transactions.filter((t) => t.id !== id);
        saveAndRefresh();
      }

      function updateTransactionDate(id, newDate) {
        if (!newDate) return;

        saveState();
        const transaction = transactions.find((t) => t.id === id);
        if (transaction) {
          transaction.date = newDate;
          saveAndRefresh();
        }
      }

      // --- 7. UNDO / REDO ---
      function undo() {
        if (historyStack.length === 0) return;

        redoStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(historyStack.pop());
        saveAndRefresh();
      }

      function redo() {
        if (redoStack.length === 0) return;

        historyStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(redoStack.pop());
        saveAndRefresh();
      }

      // --- 8. UI AKTUALISIEREN & SUMMEN BERECHNEN ---
      function updateUI() {
        const tbody = document.getElementById("transaction-list");
        const totalSpan = document.getElementById("total");
        const selectedMonth = document.getElementById("month-filter").value;

        tbody.innerHTML = "";
        let monthBalance = 0;
        let cashTotal = 0;
        let plasmaTotal = 0;
        let totalExpenses = 0;
        let totalIncome = 0;

        const savedSalary = localStorage.getItem(`salary_${selectedMonth}`);
        if (savedSalary && !isNaN(parseFloat(savedSalary))) {
          totalIncome += parseFloat(savedSalary);
        }

        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        transactions.forEach((t) => {
          if (!selectedMonth || t.date.slice(0, 7) === selectedMonth) {
            monthBalance += t.amount;

            if (t.amount < 0) {
              totalExpenses += Math.abs(t.amount);
            } else {
              totalIncome += t.amount;
            }

            const descLower = t.desc.toLowerCase();
            if (descLower.includes("cash") && t.amount > 0) {
              cashTotal += t.amount;
            }
            if (descLower.includes("plasma") && t.amount > 0) {
              plasmaTotal += t.amount;
            }

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>
                    <input type="date" value="${t.date}" onchange="updateTransactionDate(${t.id}, this.value)">
                </td>
                <td>${t.desc}</td>
                <td style="color: ${t.amount < 0 ? "#c52233" : "#32a74a"}; font-weight: bold;">
                    ${t.amount.toFixed(2)}€
                </td>
                <td>
                    <button class="btn-delete" onclick="deleteTransaction(${t.id})">X</button>
                </td>
            `;
            tbody.appendChild(row);
          }
        });

        totalSpan.innerText = monthBalance.toFixed(2) + "€";
        totalSpan.style.color = monthBalance < 0 ? "#c52233" : "#32a74a";

        document.getElementById("cash-total").innerText =
          cashTotal.toFixed(2) + "€";
        document.getElementById("plasma-total").innerText =
          plasmaTotal.toFixed(2) + "€";

        const cashPlasmaSum = cashTotal + plasmaTotal;
        document.getElementById("cash-plasma-sum").innerText =
          cashPlasmaSum.toFixed(2) + "€";

        document.getElementById("total-expenses").innerText =
          totalExpenses.toFixed(2) + "€";
        document.getElementById("total-income").innerText =
          totalIncome.toFixed(2) + "€";

        const netTotal = totalIncome - totalExpenses;
        const netTotalSpan = document.getElementById("net-total");
        netTotalSpan.innerText = netTotal.toFixed(2) + "€";
        netTotalSpan.style.color = netTotal < 0 ? "#c52233" : "#32a74a";
      }
    </script>
  </body>
</html>
