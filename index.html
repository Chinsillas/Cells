<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cells</title>

    <style>
      /* --- 1. ALLGEMEINES LAYOUT & CARDS --- */
      body {
        font-family: Helvetica, sans-serif;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        font-size: 16px;
      }

      .card {
        background: #f4f4f9;
        padding: 18px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      /* --- 2. FORMULAR-ELEMENTE & BUTTONS --- */
      input,
      select,
      button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        height: 48px;
        padding: 0 12px;
        margin: 6px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px; /* Verhindert Auto-Zoom auf Safari iOS */
        background-color: #fff;
      }

      button {
        background-color: #28a745;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-delete {
        background-color: #dc3545 !important;
        color: white !important;
        width: auto !important;
        height: auto !important;
        padding: 6px 12px !important;
        font-size: 16px !important;
      }

      /* Zentrieren von Text in Datums-Inputs */
      input[type="date"],
      input[type="month"] {
        color: #000000;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 48px;
        font-size: 16px;
      }

      input[type="date"]::-webkit-date-and-time-value,
      input[type="month"]::-webkit-date-and-time-value {
        text-align: center;
        color: #000000;
        margin: auto;
      }

      /* Grid für die Info-Boxen (Salary, Cash & Plasma) */
      .stats-grid {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .stat-box {
        flex: 1;
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 10px;
        text-align: center;
      }

      .stat-box label {
        display: block;
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 4px;
      }

      .stat-box span {
        font-size: 16px;
        font-weight: bold;
        color: #28a745;
      }

      /* Anpassung für das interaktive Gehaltsfeld im Stat-Box Look */
      .salary-input {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 2px 0 !important;
        border: none !important;
        background: transparent !important;
        text-align: center !important;
        font-size: 16px !important;
        font-weight: bold !important;
        color: #28a745 !important;
      }

      .salary-input:focus {
        outline: none;
        background: #f0f8f0 !important;
        border-radius: 4px;
      }

      /* --- 3. TABELLEN-STYLING --- */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 16px;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px 8px;
        text-align: left;
      }

      /* Neuer sauberer Ansatz für das Datumsfeld in der Tabelle */
      .table-date-wrapper {
        position: relative;
        display: inline-block;
        width: 100%;
      }

      .table-date-btn {
        width: 100%;
        height: 38px;
        margin: 0;
        padding: 0;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .table-date-hidden-input {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        opacity: 0 !important;
        cursor: pointer;
        -webkit-appearance: none;
      }
    </style>
  </head>

  <body>
    <!-- ========================================== -->
    <!-- ANSICHT 1: DASHBOARD                      -->
    <!-- ========================================== -->
    <div id="dashboard-view" style="display: block">
      <h2>Welcome to Cells</h2>
      <p>Your personal finance tracker.</p>

      <div class="card" style="text-align: center; margin-top: 20px">
        <button onclick="showMainView()" style="padding: 12px; font-size: 16px">
          Monthly Overview
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- ANSICHT 2: MONATSÜBERSICHT                 -->
    <!-- ========================================== -->
    <div id="main-view" style="display: none">
      <button
        onclick="showDashboard()"
        style="
          background-color: #6c757d;
          width: auto;
          margin-bottom: 15px;
          padding: 6px 12px;
        "
      >
        Dashboard
      </button>

      <div class="filter-selection">
        <label for="month-filter"><strong>Select Month:</strong></label>
        <input type="month" id="month-filter" onchange="onMonthChange()" />
      </div>

      <!-- GEHALT & KATEGORIEN INFO CARD -->
      <div class="card">
        <!-- Längliches Gehalts-Feld oben -->
        <div class="stat-box" style="margin-bottom: 10px">
          <label>Monthly Salary</label>
          <input
            type="text"
            id="monthly-salary"
            class="salary-input"
            placeholder="0.00€"
            onfocus="onSalaryFocus()"
            onblur="onSalaryBlur()"
            onchange="saveMonthlySalary()"
          />
        </div>

        <!-- Cash Inflow & Plasma Donation nebeneinander -->
        <div class="stats-grid">
          <div class="stat-box">
            <label>Cash Inflow</label>
            <span id="cash-total">0.00€</span>
          </div>
          <div class="stat-box">
            <label>Plasma Donation</label>
            <span id="plasma-total">0.00€</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Sum: <span id="total">0.00€</span></h3>
        <input type="text" id="desc" placeholder="Description" />
        <input type="number" id="amount" placeholder="Amount" />
        <input type="date" id="date" />
        <button onclick="addTransaction()">Add Transaction</button>
      </div>

      <div style="margin-bottom: 10px; display: flex; gap: 10px">
        <button onclick="undo()" style="background-color: #6c757d">undo</button>
        <button onclick="redo()" style="background-color: #6c757d">redo</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->
    <script>
      // --- 1. STATE & INITIALISIERUNG ---
      let transactions = JSON.parse(localStorage.getItem("my_transactions")) || [];
      let historyStack = [];
      let redoStack = [];

      const today = new Date();
      document.getElementById("date").value = today.toISOString().split("T")[0];
      document.getElementById("month-filter").value = today.toISOString().slice(0, 7);

      loadMonthlySalary();
      updateUI();

      // --- 2. SPEICHER- & HILFSFUNKTIONEN ---
      function saveState() {
        historyStack.push(JSON.stringify(transactions));
        redoStack = [];
      }

      function saveAndRefresh() {
        localStorage.setItem("my_transactions", JSON.stringify(transactions));
        updateUI();
      }

      // --- 3. GEHALTS-LOGIK ---
      function saveMonthlySalary() {
        const month = document.getElementById("month-filter").value;
        const input = document.getElementById("monthly-salary");
        let cleanVal = input.value.replace(/[^0-9.,]/g, "").replace(",", ".");
        
        if (month) {
          if (cleanVal !== "") {
            localStorage.setItem(`salary_${month}`, cleanVal);
          } else {
            localStorage.removeItem(`salary_${month}`);
          }
        }
        formatSalaryDisplay();
      }

      function loadMonthlySalary() {
        const month = document.getElementById("month-filter").value;
        const savedSalary = localStorage.getItem(`salary_${month}`) || "";
        document.getElementById("monthly-salary").value = savedSalary;
        formatSalaryDisplay();
      }

      function formatSalaryDisplay() {
        const input = document.getElementById("monthly-salary");
        let val = input.value.replace(/[^0-9.,]/g, "").replace(",", ".");
        if (val !== "" && !isNaN(parseFloat(val))) {
          input.value = parseFloat(val).toFixed(2) + "€";
        } else {
          input.value = "";
        }
      }

      function onSalaryFocus() {
        const input = document.getElementById("monthly-salary");
        let val = input.value.replace(/[^0-9.,]/g, "").replace(",", ".");
        input.value = val;
      }

      function onSalaryBlur() {
        saveMonthlySalary();
      }

      function onMonthChange() {
        loadMonthlySalary();
        updateUI();
      }

      // --- 4. NAVIGATION (ANSICHTEN UMSCHALTEN) ---
      function showMainView() {
        document.getElementById("dashboard-view").style.display = "none";
        document.getElementById("main-view").style.display = "block";
      }

      function showDashboard() {
        document.getElementById("main-view").style.display = "none";
        document.getElementById("dashboard-view").style.display = "block";
      }

      // --- 5. TRANSAKTIONEN VERWALTEN ---
      function addTransaction() {
        const descInput = document.getElementById("desc");
        const amountInput = document.getElementById("amount");
        const dateInput = document.getElementById("date");

        const desc = descInput.value;
        const amount = parseFloat(amountInput.value);
        const date = dateInput.value;

        if (!desc || isNaN(amount) || !date) {
          alert("Please enter a valid Description and Amount");
          return;
        }

        saveState();

        transactions.push({ id: Date.now(), desc, amount, date });

        document.getElementById("month-filter").value = date.slice(0, 7);
        loadMonthlySalary();

        saveAndRefresh();

        descInput.value = "";
        amountInput.value = "";
        dateInput.value = today.toISOString().split("T")[0];
      }

      function deleteTransaction(id) {
        if (!confirm("Do you really want to remove this transaction?")) return;

        saveState();
        transactions = transactions.filter((t) => t.id !== id);
        saveAndRefresh();
      }

      function updateTransactionDate(id, newDate) {
        if (!newDate) return;

        saveState();
        const transaction = transactions.find((t) => t.id === id);
        if (transaction) {
          transaction.date = newDate;
          saveAndRefresh();
        }
      }

      // --- 6. UNDO / REDO ---
      function undo() {
        if (historyStack.length === 0) return;

        redoStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(historyStack.pop());
        saveAndRefresh();
      }

      function redo() {
        if (redoStack.length === 0) return;

        historyStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(redoStack.pop());
        saveAndRefresh();
      }

      // --- 7. UI AKTUALISIEREN & SUMMEN BERECHNEN ---
      function updateUI() {
        const tbody = document.getElementById("transaction-list");
        const totalSpan = document.getElementById("total");
        const selectedMonth = document.getElementById("month-filter").value;

        tbody.innerHTML = "";
        let monthBalance = 0;
        let cashTotal = 0;
        let plasmaTotal = 0;

        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        transactions.forEach((t) => {
          if (!selectedMonth || t.date.slice(0, 7) === selectedMonth) {
            monthBalance += t.amount;

            const descLower = t.desc.toLowerCase();
            if (descLower.includes("cash") && t.amount > 0) {
              cashTotal += t.amount;
            }
            if (descLower.includes("plasma") && t.amount > 0) {
              plasmaTotal += t.amount;
            }

            // Datum als TT.MM. formatieren
            const dateParts = t.date.split("-"); // [YYYY, MM, DD]
            const shortDateStr = `${dateParts[2]}.${dateParts[1]}.`;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>
                    <div class="table-date-wrapper">
                        <div class="table-date-btn">${shortDateStr}</div>
                        <input type="date" class="table-date-hidden-input" value="${t.date}" onchange="updateTransactionDate(${t.id}, this.value)">
                    </div>
                </td>
                <td>${t.desc}</td>
                <td style="color: ${t.amount < 0 ? "#dc3545" : "#28a745"}; font-weight: bold;">
                    ${t.amount.toFixed(2)}€
                </td>
                <td>
                    <button class="btn-delete" onclick="deleteTransaction(${t.id})">X</button>
                </td>
            `;
            tbody.appendChild(row);
          }
        });

        totalSpan.innerText = monthBalance.toFixed(2) + "€";
        totalSpan.style.color = monthBalance < 0 ? "#dc3545" : "#28a745";

        document.getElementById("cash-total").innerText = cashTotal.toFixed(2) + "€";
        document.getElementById("plasma-total").innerText = plasmaTotal.toFixed(2) + "€";
      }
    </script>
  </body>
</html>
