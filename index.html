<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cells</title>
        <style>
            body{font-family:Helvetica, sans-serif; padding: 20px; max-width: 500px; margin: auto;}
            .card{background: #f4f4f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;}
            input, button{padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box;}
            table{width: 100%; border-collapse: collapse; margin-top: 10px;}
            th, td{border: 1px solid #ddd; padding: 8px; text-align: left;}
        </style>
    </head>
    <body>
        <h2>Cells – My Finance Planer</h2>

        <div class="card">
            <h3>Sum: <span id="total">0</span>€</h3>
            <input type="text" id="desc" placeholder="Description">
            <input type="number" id="amount" placeholder="Amount">
            <button onclick="addTransaction()">Add Transaction</button>
        </div> 

        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="transaction-list"></tbody>
        </table>

        <script>
            let transactions = JSON.parse(localStorage.getItem('my_transactions')) || [];
            updateUI();

            function addTransaction(){
                const descInput = document.getElementById('desc');
                const amountInput = document.getElementById('amount');

                const desc = descInput.value;
                const amount = parseFloat(amountInput.value);

                if (!desc || isNaN(amount)){
                    alert("Please enter a valid Description and Amount");
                    return;
                }

                const newTransaction ={desc: desc, amount: amount};
                transactions.push(newTransaction);

                saveToLocalStorage();

                updateUI()

                descInput.value = '';
                amountInput,value = '';
            }

            function saveToLocalStorage(){
                localStorage.setItem('my_transactions', JSON.stringify(transactions));
            }
            function updateUI(){
                const tbody = document.getElementById('transaction-list');
                const totalSpan = document.getElementById('total');

                tbody.innerHTML = '';

                let balance = 0;

                transactions.forEach((t, index) => {
                    balance += t.amount;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                    td>${t.desc}</td>
                    <td>${t.amount.toFixed(2)} €</td>
                    <td><button onclick="deleteTransaction(${index})" style="background-color: #dc3545; padding: 2px 8px; margin: 0; width: auto;">X</button></td>
                    `;
                    tbody.appendChild(row);
                });
                totalSpan.innerText = balance.toFixed(2);
            }
            function deleteTransaction(index){
                transactions.splice(index, 1);

                saveToLocalStorage();
                updateUI();
            }
        </script>
    </body>
</html>
