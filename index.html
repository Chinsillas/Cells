<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cells</title>

    <style>
      /* --- 1. ALLGEMEINES LAYOUT & CARDS --- */
      body {
        font-family: Helvetica, sans-serif;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        font-size: 16px;
        background-color: #f6f6f6;
      }

      .card {
        background: #edede9;
        padding: 18px;
        border-radius: 20px;
        margin-bottom: 20px;
      }

      /* --- 2. FORMULAR-ELEMENTE & BUTTONS --- */
      input,
      select,
      button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        height: 48px;
        padding: 0 12px;
        margin: 6px 0;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        font-size: 16px; /* Verhindert Auto-Zoom auf Safari iOS */
        background-color: #ffffff;
      }

      button {
        background-color: #40916c;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-delete {
        background-color: #c52233 !important;
        color: white !important;
        width: auto !important;
        height: auto !important;
        padding: 6px 12px !important;
        font-size: 12px !important;
      }

      /* Zentrieren von Text in Datums-Inputs */
      input[type="date"],
      input[type="month"] {
        color: #000000;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 48px;
        font-size: 16px;
      }

      input[type="date"]::-webkit-date-and-time-value,
      input[type="month"]::-webkit-date-and-time-value {
        text-align: center;
        color: #000000;
        margin: auto;
      }

      /* Grid für die Info-Boxen */
      .stats-grid {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .stat-box {
        flex: 1;
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* Spezielles schmälere (dünnere) Info-Box */
      .stat-box-thin {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 4px 8px;
        text-align: center;
        margin-top: 10px;
      }

      .stat-box label,
      .stat-box-thin label {
        display: block;
        font-size: 11px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .stat-box span,
      .stat-box-thin span {
        font-size: 15px;
        font-weight: bold;
        color: #32a74a;
      }

      /* --- 3. DASHBOARD GRID LAYOUT --- */
      .dashboard-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .dashboard-row {
        display: flex;
        gap: 10px;
      }

      .dashboard-box-large {
        flex: 2;
        min-height: 110px;
      }

      .dashboard-box-tall {
        flex: 1;
        min-height: 110px;
      }

      .dashboard-box-small {
        flex: 1;
        min-height: 44px;
      }

      /* Spezielle Spalte für Sparziel + Progress-Box */
      .savings-goal-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Spezielle Boxen für Sparziele */
      .savings-goal-box {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 105px;
      }

      .savings-goal-box label {
        display: block;
        font-size: 11px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 2px;
      }

      /* Weiße Box für Ladebalken & Prozentzahl */
      .progress-box {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 8px 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background-color: #edede9;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 4px;
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background-color: #40916c;
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      .progress-text {
        font-size: 12px;
        font-weight: bold;
        color: #666;
      }

      /* Dropdown (Accordion) für Savings */
      details.savings-dropdown {
        background: #ffffff;
        border: 1px solid #d6ccc2;
        border-radius: 18px;
        padding: 10px 14px;
        margin-top: 5px;
      }

      details.savings-dropdown summary {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        font-weight: bold;
        cursor: pointer;
        outline: none;
        text-align: center;
        list-style: none; /* Versteckt den Standard-Pfeil in einigen Browsern sauberer */
      }

      details.savings-dropdown summary::-webkit-details-marker {
        display: none;
      }

      details.savings-dropdown[open] summary {
        margin-bottom: 12px;
      }

      .savings-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid #f0eee9;
        padding-top: 10px;
      }

      /* Interaktive Input-Felder im Dashboard */
      .dash-input {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 2px 0 !important;
        border: none !important;
        background: transparent !important;
        text-align: center !important;
        font-size: 16px !important;
        font-weight: bold !important;
      }

      .dash-input:focus {
        outline: none;
        background: #ffffff !important;
        border-radius: 18px;
      }

      .salary-input {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 2px 0 !important;
        border: none !important;
        background: transparent !important;
        text-align: center !important;
        font-size: 16px !important;
        font-weight: bold !important;
      }

      .salary-input:focus {
        outline: none;
        background: #ffffff !important;
        border-radius: 18px;
      }

      /* Farbvarianten für Income & Expenses */
      .expenses-val {
        color: #c52233 !important;
        font-weight: bold;
        font-size: 16px;
      }

      .income-val {
        color: #32a74a !important;
        font-weight: bold;
        font-size: 16px;
      }

      /* --- 4. TABELLEN-STYLING --- */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 16px;
      }

      th,
      td {
        border: 1px solid #d6ccc2;
        padding: 10px 8px;
        text-align: left;
      }

      /* Styling für das Datums-Auswahlfeld in der Tabelle */
      table input[type="date"] {
        width: 100% !important;
        height: auto !important;
        min-height: 36px !important;
        padding: 4px 6px !important;
        line-height: normal !important;
        display: inline-block !important;
        font-size: 15px !important;
      }

      .custom-label {
        text-align: center;
        text-transform: uppercase;
        color: #666;
        font-weight: bold;
        font-size: 12px;
        margin-top: 0px;
      }

      .custom-label2 {
        color: #666;
        font-weight: bold;
        font-size: 16px;
        margin-top: 0px;
      }
    </style>
  </head>

  <body>
    <!-- ========================================== -->
    <!-- ANSICHT 1: DASHBOARD                      -->
    <!-- ========================================== -->
    <div id="dashboard-view" style="display: block">
      <h2>Welcome to Cells</h2>

      <!-- DASHBOARD LAYOUT GRID -->
      <div class="card">
        <div class="dashboard-grid">
          <!-- OBERER BEREICH: TOTAL & THIS MONTH -->
          <div class="dashboard-row">
            <!-- Total (Horizontal / Groß) -->
            <div class="stat-box dashboard-box-large">
              <label>Total</label>
              <span
                id="dash-total-val"
                style="font-size: 20px; font-weight: bold"
                >0.00€</span
              >
            </div>

            <!-- This Month (Vertikal / Hoch) -->
            <div class="stat-box dashboard-box-tall">
              <label>This Month</label>
              <input
                type="text"
                id="dash-this-month"
                class="dash-input"
                placeholder="0.00€"
                onfocus="onDashInputFocus('dash-this-month')"
                onblur="onDashInputBlur('dash-this-month')"
                onchange="saveDashboardData()"
              />
            </div>
          </div>

          <!-- 2 FELDER NEBENEINANDER (CASH, PAYPAL) -->
          <div class="dashboard-row">
            <div class="stat-box dashboard-box-small">
              <label>Cash</label>
              <input
                type="text"
                id="dash-top-cash"
                class="dash-input"
                placeholder="0.00€"
                onfocus="onDashInputFocus('dash-top-cash')"
                onblur="onDashInputBlur('dash-top-cash')"
                onchange="saveDashboardData()"
              />
            </div>
            <div class="stat-box dashboard-box-small">
              <label>Paypal</label>
              <input
                type="text"
                id="dash-paypal"
                class="dash-input"
                placeholder="0.00€"
                onfocus="onDashInputFocus('dash-paypal')"
                onblur="onDashInputBlur('dash-paypal')"
                onchange="saveDashboardData()"
              />
            </div>
          </div>

          <!-- SAVINGS DROPDOWN-MENÜ -->
          <details class="savings-dropdown">
            <summary>Savings</summary>
            <div class="savings-content">
              <!-- UNTERER BEREICH: TOTAL SAVINGS -->
              <div class="dashboard-row">
                <div class="stat-box" style="flex: 1; min-height: 50px">
                  <label>Total Savings</label>
                  <span
                    id="dash-savings-val"
                    style="font-size: 18px; font-weight: bold"
                    >0.00€</span
                  >
                </div>
              </div>

              <!-- BANK SAVINGS -->
              <div class="dashboard-row">
                <div class="stat-box dashboard-box-small" style="flex: 1">
                  <label>Bank Savings</label>
                  <input
                    type="text"
                    id="dash-bank-savings"
                    class="dash-input"
                    placeholder="0.00€"
                    onfocus="onDashInputFocus('dash-bank-savings')"
                    onblur="onDashInputBlur('dash-bank-savings')"
                    onchange="saveDashboardData()"
                  />
                </div>
              </div>

              <!-- CASH SAVINGS -->
              <div class="dashboard-row">
                <div class="stat-box dashboard-box-small" style="flex: 1">
                  <label>Cash Savings</label>
                  <input
                    type="text"
                    id="dash-cash-savings"
                    class="dash-input"
                    placeholder="0.00€"
                    onfocus="onDashInputFocus('dash-cash-savings')"
                    onblur="onDashInputBlur('dash-cash-savings')"
                    onchange="saveDashboardData()"
                  />
                </div>
              </div>

              <!-- SPARZIELE NEBENEINANDER MIT LADEBALKEN -->
              <div class="dashboard-row">
                <!-- Travels -->
                <div class="savings-goal-col">
                  <div class="savings-goal-box">
                    <label>Travels</label>
                    <input
                      type="text"
                      id="dash-travels"
                      class="dash-input"
                      placeholder="0.00€"
                      onfocus="onDashInputFocus('dash-travels')"
                      onblur="onDashInputBlur('dash-travels')"
                      onchange="saveDashboardData()"
                    />
                    <div
                      style="
                        font-size: 12px;
                        margin-top: 2px;
                        width: 100%;
                        display: flex;
                        justify-content: center;
                      "
                    >
                      <input
                        type="text"
                        id="goal-travels"
                        class="dash-input"
                        style="
                          font-size: 12px !important;
                          color: #666 !important;
                          width: 80px !important;
                          height: 22px !important;
                          padding: 0 !important;
                          margin: 0 !important;
                          background: transparent !important;
                          text-align: center !important;
                        "
                        placeholder="0.00€"
                        onfocus="onDashInputFocus('goal-travels')"
                        onblur="onDashInputBlur('goal-travels')"
                        onchange="saveDashboardData()"
                      />
                    </div>
                  </div>
                  <div class="progress-box">
                    <div class="progress-bar-bg">
                      <div id="bar-travels" class="progress-bar-fill"></div>
                    </div>
                    <span id="pct-travels" class="progress-text">0%</span>
                  </div>
                </div>

                <!-- Studies -->
                <div class="savings-goal-col">
                  <div class="savings-goal-box">
                    <label>Studies</label>
                    <input
                      type="text"
                      id="dash-studies"
                      class="dash-input"
                      placeholder="0.00€"
                      onfocus="onDashInputFocus('dash-studies')"
                      onblur="onDashInputBlur('dash-studies')"
                      onchange="saveDashboardData()"
                    />
                    <div
                      style="
                        font-size: 12px;
                        margin-top: 2px;
                        width: 100%;
                        display: flex;
                        justify-content: center;
                      "
                    >
                      <input
                        type="text"
                        id="goal-studies"
                        class="dash-input"
                        style="
                          font-size: 12px !important;
                          color: #666 !important;
                          width: 80px !important;
                          height: 22px !important;
                          padding: 0 !important;
                          margin: 0 !important;
                          background: transparent !important;
                          text-align: center !important;
                        "
                        placeholder="0.00€"
                        onfocus="onDashInputFocus('goal-studies')"
                        onblur="onDashInputBlur('goal-studies')"
                        onchange="saveDashboardData()"
                      />
                    </div>
                  </div>
                  <div class="progress-box">
                    <div class="progress-bar-bg">
                      <div id="bar-studies" class="progress-bar-fill"></div>
                    </div>
                    <span id="pct-studies" class="progress-text">0%</span>
                  </div>
                </div>

                <!-- Car -->
                <div class="savings-goal-col">
                  <div class="savings-goal-box">
                    <label>Car</label>
                    <input
                      type="text"
                      id="dash-car"
                      class="dash-input"
                      placeholder="0.00€"
                      onfocus="onDashInputFocus('dash-car')"
                      onblur="onDashInputBlur('dash-car')"
                      onchange="saveDashboardData()"
                    />
                    <div
                      style="
                        font-size: 12px;
                        margin-top: 2px;
                        width: 100%;
                        display: flex;
                        justify-content: center;
                      "
                    >
                      <input
                        type="text"
                        id="goal-car"
                        class="dash-input"
                        style="
                          font-size: 12px !important;
                          color: #666 !important;
                          width: 80px !important;
                          height: 22px !important;
                          padding: 0 !important;
                          margin: 0 !important;
                          background: transparent !important;
                          text-align: center !important;
                        "
                        placeholder="0.00€"
                        onfocus="onDashInputFocus('goal-car')"
                        onblur="onDashInputBlur('goal-car')"
                        onchange="saveDashboardData()"
                      />
                    </div>
                  </div>
                  <div class="progress-box">
                    <div class="progress-bar-bg">
                      <div id="bar-car" class="progress-bar-fill"></div>
                    </div>
                    <span id="pct-car" class="progress-text">0%</span>
                  </div>
                </div>
              </div>
            </div>
          </details>
        </div>
      </div>

      <div class="card" style="text-align: center; margin-top: 20px">
        <button onclick="showMainView()" style="padding: 12px; font-size: 16px">
          Monthly Overview
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- ANSICHT 2: MONATSÜBERSICHT                 -->
    <!-- ========================================== -->
    <div id="main-view" style="display: none">
      <button
        onclick="showDashboard()"
        style="
          background-color: #40916c;
          width: auto;
          margin-bottom: 15px;
          padding: 6px 12px;
        "
      >
        Dashboard
      </button>

      <div class="filter-selection">
        <input type="month" id="month-filter" onchange="onMonthChange()" />
      </div>

      <!-- GEHALT & KATEGORIEN INFO CARD -->
      <div class="card">
        <p class="custom-label">Earned this month</p>
        <!-- Längliches Gehalts-Feld oben -->
        <div class="stat-box" style="margin-bottom: 10px">
          <label>Salary</label>
          <input
            type="text"
            id="monthly-salary"
            class="salary-input"
            placeholder="0.00€"
            onfocus="onSalaryFocus()"
            onblur="onSalaryBlur()"
            onchange="saveMonthlySalary()"
          />
        </div>

        <!-- Cash Inflow & Dynamic Label nebeneinander -->
        <div class="stats-grid">
          <div class="stat-box">
            <label>Cash</label>
            <span id="cash-total">0.00€</span>
          </div>
          <div class="stat-box">
            <label id="dynamic-label">Plasma</label>
            <span id="plasma-total">0.00€</span>
          </div>
        </div>

        <div class="stat-box-thin">
          <label>Total</label>
          <span id="cash-plasma-sum">0.00€</span>
        </div>
      </div>

      <!-- TOTAL INCOME & TOTAL EXPENSES CARD -->
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box">
            <label>Total Income</label>
            <span id="total-income" class="income-val">0.00€</span>
          </div>
          <div class="stat-box">
            <label>Total Expenses</label>
            <span id="total-expenses" class="expenses-val">0.00€</span>
          </div>
        </div>

        <div class="stat-box-thin">
          <label>Net Total</label>
          <span id="net-total">0.00€</span>
        </div>
      </div>

      <div class="card">
        <h3 class="custom-label2">Sum: <span id="total">0.00€</span></h3>
        <input type="text" id="desc" placeholder="Description" />
        <input type="number" id="amount" placeholder="Amount" />
        <input type="date" id="date" />
        <button onclick="addTransaction()">Add Transaction</button>
      </div>

      <div style="margin-bottom: 10px; display: flex; gap: 10px">
        <button
          onclick="undo()"
          style="
            background-color: #40916c;
            height: 32px;
            width: 48px;
            padding: 2px 8px;
            font-size: 14px;
          "
        >
          ←
        </button>
        <button
          onclick="redo()"
          style="
            background-color: #40916c;
            height: 32px;
            width: 48px;
            padding: 2px 8px;
            font-size: 14px;
          "
        >
          →
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->
    <script>
      // --- 1. STATE & INITIALISIERUNG ---
      let transactions =
        JSON.parse(localStorage.getItem("my_transactions")) || [];
      let historyStack = [];
      let redoStack = [];

      const today = new Date();
      document.getElementById("date").value = today.toISOString().split("T")[0];
      document.getElementById("month-filter").value = today
        .toISOString()
        .slice(0, 7);

      loadMonthlySalary();
      loadDashboardData();
      updateUI();

      // --- 2. SPEICHER- & HILFSFUNKTIONEN ---
      function saveState() {
        historyStack.push(JSON.stringify(transactions));
        redoStack = [];
      }

      function saveAndRefresh() {
        localStorage.setItem("my_transactions", JSON.stringify(transactions));
        updateUI();
      }

      // --- 3. DASHBOARD LOGIK ---
      function saveDashboardData() {
        const thisMonthVal = cleanNumber(
          document.getElementById("dash-this-month").value,
        );
        const topCashVal = cleanNumber(
          document.getElementById("dash-top-cash").value,
        );
        const paypalVal = cleanNumber(
          document.getElementById("dash-paypal").value,
        );

        const bankSavingsVal = cleanNumber(
          document.getElementById("dash-bank-savings").value,
        );
        const cashSavingsVal = cleanNumber(
          document.getElementById("dash-cash-savings").value,
        );
        const travelsVal = cleanNumber(
          document.getElementById("dash-travels").value,
        );
        const studiesVal = cleanNumber(
          document.getElementById("dash-studies").value,
        );
        const carVal = cleanNumber(document.getElementById("dash-car").value);

        const goalTravelsVal = cleanNumber(
          document.getElementById("goal-travels").value,
        );
        const goalStudiesVal = cleanNumber(
          document.getElementById("goal-studies").value,
        );
        const goalCarVal = cleanNumber(
          document.getElementById("goal-car").value,
        );

        localStorage.setItem("dash_this_month", thisMonthVal);
        localStorage.setItem("dash_top_cash", topCashVal);
        localStorage.setItem("dash_paypal", paypalVal);

        localStorage.setItem("dash_bank_savings", bankSavingsVal);
        localStorage.setItem("dash_cash_savings", cashSavingsVal);
        localStorage.setItem("dash_travels", travelsVal);
        localStorage.setItem("dash_studies", studiesVal);
        localStorage.setItem("dash_car", carVal);

        localStorage.setItem("goal_travels", goalTravelsVal);
        localStorage.setItem("goal_studies", goalStudiesVal);
        localStorage.setItem("goal_car", goalCarVal);

        renderDashboard();
      }

      function loadDashboardData() {
        document.getElementById("dash-this-month").value =
          localStorage.getItem("dash_this_month") || "";
        document.getElementById("dash-top-cash").value =
          localStorage.getItem("dash_top_cash") || "";
        document.getElementById("dash-paypal").value =
          localStorage.getItem("dash_paypal") || "";

        document.getElementById("dash-bank-savings").value =
          localStorage.getItem("dash_bank_savings") || "";
        document.getElementById("dash-cash-savings").value =
          localStorage.getItem("dash_cash_savings") || "";
        document.getElementById("dash-travels").value =
          localStorage.getItem("dash_travels") || "";
        document.getElementById("dash-studies").value =
          localStorage.getItem("dash_studies") || "";
        document.getElementById("dash-car").value =
          localStorage.getItem("dash_car") || "";

        document.getElementById("goal-travels").value =
          localStorage.getItem("goal_travels") || "";
        document.getElementById("goal-studies").value =
          localStorage.getItem("goal_studies") || "";
        document.getElementById("goal-car").value =
          localStorage.getItem("goal_car") || "";

        renderDashboard();
      }

      function updateProgress(currentVal, goalVal, barId, pctId) {
        let pct = 0;
        if (goalVal > 0 && currentVal > 0) {
          pct = (currentVal / goalVal) * 100;
        }
        const clampedPct = Math.min(Math.max(pct, 0), 100);
        document.getElementById(barId).style.width = clampedPct + "%";
        document.getElementById(pctId).innerText = Math.round(pct) + "%";
      }

      function renderDashboard() {
        const thisMonthVal =
          parseFloat(localStorage.getItem("dash_this_month")) || 0;
        const topCashVal =
          parseFloat(localStorage.getItem("dash_top_cash")) || 0;
        const paypalVal = parseFloat(localStorage.getItem("dash_paypal")) || 0;

        const bankSavingsVal =
          parseFloat(localStorage.getItem("dash_bank_savings")) || 0;
        const cashSavingsVal =
          parseFloat(localStorage.getItem("dash_cash_savings")) || 0;
        const travelsVal =
          parseFloat(localStorage.getItem("dash_travels")) || 0;
        const studiesVal =
          parseFloat(localStorage.getItem("dash_studies")) || 0;
        const carVal = parseFloat(localStorage.getItem("dash_car")) || 0;

        const goalTravelsVal =
          parseFloat(localStorage.getItem("goal_travels")) || 0;
        const goalStudiesVal =
          parseFloat(localStorage.getItem("goal_studies")) || 0;
        const goalCarVal = parseFloat(localStorage.getItem("goal_car")) || 0;

        formatDashInput(
          "dash-this-month",
          localStorage.getItem("dash_this_month"),
          thisMonthVal,
        );
        formatDashInput(
          "dash-top-cash",
          localStorage.getItem("dash_top_cash"),
          topCashVal,
        );
        formatDashInput(
          "dash-paypal",
          localStorage.getItem("dash_paypal"),
          paypalVal,
        );

        formatDashInput(
          "dash-bank-savings",
          localStorage.getItem("dash_bank_savings"),
          bankSavingsVal,
        );
        formatDashInput(
          "dash-cash-savings",
          localStorage.getItem("dash_cash_savings"),
          cashSavingsVal,
        );
        formatDashInput(
          "dash-travels",
          localStorage.getItem("dash_travels"),
          travelsVal,
        );
        formatDashInput(
          "dash-studies",
          localStorage.getItem("dash_studies"),
          studiesVal,
        );
        formatDashInput("dash-car", localStorage.getItem("dash_car"), carVal);

        formatGoalInput(
          "goal-travels",
          localStorage.getItem("goal_travels"),
          goalTravelsVal,
        );
        formatGoalInput(
          "goal-studies",
          localStorage.getItem("goal_studies"),
          goalStudiesVal,
        );
        formatGoalInput(
          "goal-car",
          localStorage.getItem("goal_car"),
          goalCarVal,
        );

        // Ladebalken & Prozentwerte aktualisieren
        updateProgress(
          travelsVal,
          goalTravelsVal,
          "bar-travels",
          "pct-travels",
        );
        updateProgress(
          studiesVal,
          goalStudiesVal,
          "bar-studies",
          "pct-studies",
        );
        updateProgress(carVal, goalCarVal, "bar-car", "pct-car");

        // Farbanpassung für die Beträge (Grün wenn > 0, Grau wenn == 0, Rot wenn < 0)
        const tInput = document.getElementById("dash-travels");
        tInput.style.color =
          travelsVal > 0 ? "#32a74a" : travelsVal < 0 ? "#c52233" : "#666666";

        const sInput = document.getElementById("dash-studies");
        sInput.style.color =
          studiesVal > 0 ? "#32a74a" : studiesVal < 0 ? "#c52233" : "#666666";

        const cInput = document.getElementById("dash-car");
        cInput.style.color =
          carVal > 0 ? "#32a74a" : carVal < 0 ? "#c52233" : "#666666";

        const bsInput = document.getElementById("dash-bank-savings");
        bsInput.style.color =
          bankSavingsVal > 0
            ? "#32a74a"
            : bankSavingsVal < 0
              ? "#c52233"
              : "#666666";

        const csInput = document.getElementById("dash-cash-savings");
        csInput.style.color =
          cashSavingsVal > 0
            ? "#32a74a"
            : cashSavingsVal < 0
              ? "#c52233"
              : "#666666";

        // Berechnungen: Total Savings = Bank Savings + Cash Savings
        const totalSavings = bankSavingsVal + cashSavingsVal;
        const totalAssets =
          thisMonthVal + topCashVal + paypalVal + totalSavings;

        const savingsValSpan = document.getElementById("dash-savings-val");
        savingsValSpan.innerText = totalSavings.toFixed(2) + "€";
        savingsValSpan.style.color = totalSavings < 0 ? "#c52233" : "#32a74a";

        const totalSpan = document.getElementById("dash-total-val");
        totalSpan.innerText = totalAssets.toFixed(2) + "€";
        totalSpan.style.color = totalAssets < 0 ? "#c52233" : "#32a74a";
      }

      function cleanNumber(str) {
        if (!str) return "";
        return str.replace(/[^0-9.,-]/g, "").replace(",", ".");
      }

      function formatDashInput(elementId, valStr, numericVal) {
        const input = document.getElementById(elementId);
        const clean = cleanNumber(valStr);
        if (clean !== "" && !isNaN(parseFloat(clean))) {
          input.value = parseFloat(clean).toFixed(2) + "€";
          if (
            elementId !== "dash-travels" &&
            elementId !== "dash-studies" &&
            elementId !== "dash-car" &&
            elementId !== "dash-bank-savings" &&
            elementId !== "dash-cash-savings"
          ) {
            input.style.color = numericVal < 0 ? "#c52233" : "#32a74a";
          }
        } else {
          input.value = "";
          input.style.color = "#32a74a";
        }
      }

      function formatGoalInput(elementId, valStr, numericVal) {
        const input = document.getElementById(elementId);
        const clean = cleanNumber(valStr);
        if (clean !== "" && !isNaN(parseFloat(clean))) {
          input.value = parseFloat(clean).toFixed(2) + "€";
        } else {
          input.value = "";
        }
      }

      function onDashInputFocus(elementId) {
        const input = document.getElementById(elementId);
        input.value = cleanNumber(input.value);
        if (!elementId.startsWith("goal-")) {
          input.style.color = "#000000";
        }
      }

      function onDashInputBlur(elementId) {
        saveDashboardData();
      }

      // --- 4. GEHALTS-LOGIK ---
      function saveMonthlySalary() {
        const month = document.getElementById("month-filter").value;
        const input = document.getElementById("monthly-salary");
        let cleanVal = cleanNumber(input.value);

        if (month) {
          if (cleanVal !== "") {
            localStorage.setItem(`salary_${month}`, cleanVal);
          } else {
            localStorage.removeItem(`salary_${month}`);
          }
        }
        formatSalaryDisplay();
        updateUI();
      }

      function loadMonthlySalary() {
        const month = document.getElementById("month-filter").value;
        const savedSalary = localStorage.getItem(`salary_${month}`) || "";
        document.getElementById("monthly-salary").value = savedSalary;
        formatSalaryDisplay();
        checkDynamicLabel();
      }

      function checkDynamicLabel() {
        const month = document.getElementById("month-filter").value;
        const label = document.getElementById("dynamic-label");
        if (month && month >= "2026-11") {
          label.innerText = "Tips";
        } else {
          label.innerText = "Plasma";
        }
      }

      function formatSalaryDisplay() {
        const input = document.getElementById("monthly-salary");
        let val = cleanNumber(input.value);
        let num = parseFloat(val);
        if (val !== "" && !isNaN(num)) {
          input.value = num.toFixed(2) + "€";
          input.style.color = num < 0 ? "#c52233" : "#32a74a";
        } else {
          input.value = "";
          input.style.color = "#32a74a";
        }
      }

      function onSalaryFocus() {
        const input = document.getElementById("monthly-salary");
        input.value = cleanNumber(input.value);
        input.style.color = "#000000";
      }

      function onSalaryBlur() {
        saveMonthlySalary();
      }

      function onMonthChange() {
        loadMonthlySalary();
        checkDynamicLabel();
        updateUI();
      }

      // --- 5. NAVIGATION (ANSICHTEN UMSCHALTEN) ---
      function showMainView() {
        document.getElementById("dashboard-view").style.display = "none";
        document.getElementById("main-view").style.display = "block";
        checkDynamicLabel();
      }

      function showDashboard() {
        document.getElementById("main-view").style.display = "none";
        document.getElementById("dashboard-view").style.display = "block";
        renderDashboard();
      }

      // --- 6. TRANSAKTIONEN VERWALTEN ---
      function addTransaction() {
        const descInput = document.getElementById("desc");
        const amountInput = document.getElementById("amount");
        const dateInput = document.getElementById("date");

        const desc = descInput.value;
        const amount = parseFloat(amountInput.value);
        const date = dateInput.value;

        if (!desc || isNaN(amount) || !date) {
          alert("Please enter a valid Description and Amount");
          return;
        }

        saveState();

        transactions.push({ id: Date.now(), desc, amount, date });

        document.getElementById("month-filter").value = date.slice(0, 7);
        loadMonthlySalary();
        checkDynamicLabel();

        saveAndRefresh();

        descInput.value = "";
        amountInput.value = "";
        dateInput.value = today.toISOString().split("T")[0];
      }

      function deleteTransaction(id) {
        if (!confirm("Do you really want to remove this transaction?")) return;

        saveState();
        transactions = transactions.filter((t) => (t.id === id ? false : true));
        saveAndRefresh();
      }

      function updateTransactionDate(id, newDate) {
        if (!newDate) return;

        saveState();
        const transaction = transactions.find((t) => t.id === id);
        if (transaction) {
          transaction.date = newDate;
          saveAndRefresh();
        }
      }

      // --- 7. UNDO / REDO ---
      function undo() {
        if (historyStack.length === 0) return;

        redoStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(historyStack.pop());
        saveAndRefresh();
      }

      function redo() {
        if (redoStack.length === 0) return;

        historyStack.push(JSON.stringify(transactions));
        transactions = JSON.parse(redoStack.pop());
        saveAndRefresh();
      }

      // --- 8. UI AKTUALISIEREN & SUMMEN BERECHNEN ---
      function updateUI() {
        const tbody = document.getElementById("transaction-list");
        const totalSpan = document.getElementById("total");
        const selectedMonth = document.getElementById("month-filter").value;

        checkDynamicLabel();

        tbody.innerHTML = "";
        let monthBalance = 0;
        let cashTotal = 0;
        let secondaryTotal = 0;
        let totalExpenses = 0;
        let totalIncome = 0;

        const savedSalary = localStorage.getItem(`salary_${selectedMonth}`);
        if (savedSalary && !isNaN(parseFloat(savedSalary))) {
          totalIncome += parseFloat(savedSalary);
        }

        transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        transactions.forEach((t) => {
          if (!selectedMonth || t.date.slice(0, 7) === selectedMonth) {
            monthBalance += t.amount;

            if (t.amount < 0) {
              totalExpenses += Math.abs(t.amount);
            } else {
              totalIncome += t.amount;
            }

            const descLower = t.desc.toLowerCase();
            if (descLower.includes("cash") && t.amount > 0) {
              cashTotal += t.amount;
            }
            const secondaryKeyword =
              selectedMonth >= "2026-11" ? "tips" : "plasma";
            if (descLower.includes(secondaryKeyword) && t.amount > 0) {
              secondaryTotal += t.amount;
            }

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>
                    <input type="date" value="${t.date}" onchange="updateTransactionDate(${t.id}, this.value)">
                </td>
                <td>${t.desc}</td>
                <td style="color: ${t.amount < 0 ? "#c52233" : "#32a74a"}; font-weight: bold;">
                    ${t.amount.toFixed(2)}€
                </td>
                <td>
                    <button class="btn-delete" onclick="deleteTransaction(${t.id})">X</button>
                </td>
            `;
            tbody.appendChild(row);
          }
        });

        totalSpan.innerText = monthBalance.toFixed(2) + "€";
        totalSpan.style.color = monthBalance < 0 ? "#c52233" : "#32a74a";

        document.getElementById("cash-total").innerText =
          cashTotal.toFixed(2) + "€";
        document.getElementById("plasma-total").innerText =
          secondaryTotal.toFixed(2) + "€";

        const cashSecondarySum = cashTotal + secondaryTotal;
        document.getElementById("cash-plasma-sum").innerText =
          cashSecondarySum.toFixed(2) + "€";

        document.getElementById("total-expenses").innerText =
          totalExpenses.toFixed(2) + "€";
        document.getElementById("total-income").innerText =
          totalIncome.toFixed(2) + "€";

        const netTotal = totalIncome - totalExpenses;
        const netTotalSpan = document.getElementById("net-total");
        netTotalSpan.innerText = netTotal.toFixed(2) + "€";
        netTotalSpan.style.color = netTotal < 0 ? "#c52233" : "#32a74a";
      }
    </script>
  </body>
</html>
